id: ecg-noise-defib
title: EKG-støy under overvåking
device: LIFEPAK 15
category: defibrillator
level: 1
estimated_time: 15min
has_lab_handoff: true
briefing:
  caller: Sykepleier Inger, telemetriavdeling 4B
  location: Avdeling 4B, rom 412
  facility: Stavanger universitetssjukehus
  time: "Mandag 10:15"
  message: "LIFEPAK 15 på rom 412 viser et veldig støyfullt EKG — det er så mye støy på kurven at vi ikke kan se om pasientens rytme endrer seg. Vi har prøvd forskjellige avledninger på pasienten, og det ser fortsatt likt ut. Pasienten er post-MI og vi trenger pålitelig overvåking. Kan du komme og ta en titt?"
  urgency: medium
  context:
    - "Post-MI-pasient som krever kontinuerlig EKG-overvåking"
    - "Serienummer: 45892315"
    - "Støy på alle avledninger"
    - "Personalet har allerede prøvd å flytte elektrodene"
    - "Rom 412 ligger nær serviceheisen"
steps:
  - type: multiple-choice
    id: assessment
    question: "Du ankommer avdelingen og ser en bredbåndet, uklar grunnlinje på EKG-skjermen. Sykepleieren sier de allerede har byttet elektrodene. Hva er din systematiske tilnærming?"
    hint: "EKG-støy har tre hovedkilder: pasient/elektrode-grensesnittet, kabel/enhet og omgivelsene. Jobb fra pasienten og utover."
    choices:
      - text: "Bytt LIFEPAK 15 med en reserveenhet for å se om støyen følger enheten"
        correct: false
        feedback: "Å bytte hele enheten er et gyldig feilsøkingssteg, men det er ikke systematisk — du lærer ikke hva som forårsaker støyen."
      - text: "Sjekk hudforberedelsen ved elektrodene, deretter bytt EKG-kabelen, deretter test med en EKG-simulator for å isolere pasient kontra enhet kontra omgivelser"
        correct: true
        feedback: "Riktig — systematisk isolering: (1) pasientgrensesnitt, (2) kabel, (3) enhetens inngang, (4) omgivelser. Hvert bytte innsnevrer kilden."
      - text: "Slå av utstyr i nærheten for å sjekke for elektromagnetisk interferens"
        correct: false
        feedback: "EMI er verdt å undersøke, men å hoppe rett til omgivelsene hopper over vanligere årsaker — kabelfeil er langt hyppigere enn miljøinterferens."
      - text: "Gå inn i enhetens filterinnstillinger og aktiver 50 Hz-filtrering"
        correct: false
        feedback: "Notchfilteret fjerner nettfrekvensinterferens, men sykepleieren beskrev bredbåndsstøy. Et filter fikser ikke en kabelfeil, og det skjuler diagnostisk informasjon."
  - type: multiple-choice
    id: investigation
    question: "Du sjekker hudforberedelsen (ren hud, god kontakt) og bytter den 5-leder EKG-kabelen med en kjent god kabel fra lageret. Støyen forsvinner helt. Hva bør du gjøre videre?"
    hint: "Du har isolert feilen til kabelen. Men hvilken del av kabelen er defekt, og hvordan verifiserer du det?"
    choices:
      - text: "Kast den defekte kabelen og avslutt saken"
        correct: false
        feedback: "Ikke kast den ennå — dokumenter feilen og test den ordentlig. Du må bekrefte feilmodusen og vurdere om det er en enkelthendelse eller et partiproblem."
      - text: "Merk den defekte kabelen, ta den med til verkstedet og test kontinuitet på hver avledningsledning"
        correct: true
        feedback: "Riktig — en kontinuitetstest vil identifisere hvilken ledning som er brutt og om bruddet er intermitterende (bøyningsavhengig). Dette gir informasjon om andre kabler av samme alder/type bør inspiseres."
      - text: "Send kabelen til produsenten for analyse"
        correct: false
        feedback: "Produsentanalyse tar uker. Du kan diagnostisere en kabelfeil internt på noen minutter."
      - text: "Sjekk om kabelen er innenfor utskiftingsintervallet og bestill en ny"
        correct: false
        feedback: "Kabler svikter fra bruk, ikke alder. Et utskiftingsintervall forklarer ikke denne feilen. Test først, deretter avgjør."
  - type: lab-handoff
    id: measurement
    instruction: "Koble den defekte EKG-kabelen til et multimeter. Test kontinuitet på hver avledningsledning ved å måle motstand fra kabeltilkoblingens pinne til tilhørende elektrodeklemme. Bøy kabelen ved stresspunkter (tilkoblingspunkt, kabelforgrening) under målingen."
    simulated_data:
      tool: "Multimeter — EKG-kabel kontinuitetstest"
      readings:
        - setting: "RA-avledningsledning (RA-pinne → RA-klemme)"
          delivered: "1,2 Ω"
          status: pass
        - setting: "LA-avledningsledning (LA-pinne → LA-klemme)"
          delivered: "1,1 Ω"
          status: pass
        - setting: "LL-avledningsledning (LL-pinne → LL-klemme)"
          delivered: "∞ (åpen) ved bøyning i forgreningspunktet"
          status: fail
          error: "Intermitterende åpen krets ved bøyning"
        - setting: "V-avledningsledning (V-pinne → V-klemme)"
          delivered: "1,3 Ω"
          status: pass
        - setting: "RL-avledningsledning (RL-pinne → RL-klemme)"
          delivered: "0,9 Ω"
          status: pass
  - type: multiple-choice
    id: diagnosis
    question: "LL-avledningsledningen (venstre bein) har en intermitterende åpen krets i kabelforgreningspunktet. Denne ene brutte ledningen forårsaket støy på ALLE viste avledninger. Hvorfor?"
    choices:
      - text: "LL-elektroden er en aktiv måleelektrode, ikke jord — den inngår i II, III, alle de tre forsterkede avledningene og i Wilsons sentralterminal, og når inngangen flyter fritt, ødelegges fellesmodusundertrykkingen for resten"
        correct: true
        feedback: "Riktig — LL er et aktivt hjørne i Einthovens trekant, ikke referansen: den inngår i II (LL − RA), III (LL − LA), i alle de tre forsterkede avledningene og i Wilsons sentralterminal, WCT = (RA + LA + LL)/3, som er referanse for brystavledningen. Referanse-/drivelektroden er RL, ikke LL. Når LL-ledningen er brutt, flyter inngangen fritt, nettstøy driver inngangstrinnet mot metning, og driven-right-leg-kretsen — som arbeider ut fra summen av ekstremitetselektrodene — klarer ikke lenger å nulle ut fellesmodusspenningen. Dermed kollapser fellesmodusundertrykkingen (CMRR), og støyen kommer på alle viste avledninger. Bare avledning I (LA − RA) er uten LL, og den rammes minst. Siden bruddet er intermitterende, ser du støybyger avbrutt av korte ledningsfeilmeldinger (LEADS OFF), ikke en jevnt flat kurve."
      - text: "Den brutte ledningen skaper en kortslutning som injiserer strøm inn i alle andre avledninger"
        correct: false
        feedback: "En åpen krets injiserer ingenting — den lar inngangen flyte fritt. Den tapte elektroden pluss den kollapsede fellesmodusundertrykkingen er grunnen til at støyen dukker opp på alle avledninger i stedet for bare én."
      - text: "LL-ledningen fører driven-right-leg-signalet som kansellerer fellesmodusstøy"
        correct: false
        feedback: "Nesten — men driven-right-leg-signalet (DRL) legges på RL-elektroden, ikke LL. LL er en av ekstremitetselektrodene som drivforsterkeren tar gjennomsnittet av, så en åpen LL forringer faktisk fellesmodusundertrykkingen — men den fører aldri selve drivsignalet."
      - text: "Enheten oppdager feilen og deaktiverer inngangsfiltrene som et sikkerhetstiltak"
        correct: false
        feedback: "Enheten deaktiverer ikke filtre med vilje. Støyen oppstår fordi en måleelektrode flyter fritt, noe som ødelegger CMRR."
learning_points:
  - text: "En enkelt brutt EKG-avledningsledning kan gi støy på ALLE viste avledninger, ikke bare den avledningen som er oppkalt etter elektroden. EKG-avledninger beregnes fra kombinasjoner av elektroder, og en flytende inngang ødelegger i tillegg fellesmodusundertrykkingen som hele inngangstrinnet er avhengig av."
  - text: "Bortsett fra engangselektrodene er EKG-kabler og avledningsledninger blant det tilbehøret som oftest må skiftes i pasientovervåking — de er gjenbrukbare, men de slites ut. Intermitterende brudd ved bøyepunktene (overgangen ved kontakten, og forgreningspunktet der avledningsledningene går ut av stamkabelen) er den dominerende feilmoden, og de er som regel umulige å se utenfra."
    source_type: best-practice
  - text: "IEC 60601-2-27 oppgir ingen CMRR-verdi i dB. Fellesmodustesten legger på 20 V rms ved 50 Hz og ved 60 Hz gjennom en bevisst ubalanse i elektrodeimpedansen (51 kΩ parallelt med 47 nF), og tillater høyst 10 mm topp-til-bunn på kurven ved 10 mm/mV — det vil si 1 mV referert til inngangen, som er der ekvivalenten på ≥ 89 dB i spesifikasjonstabellene kommer fra. En åpen elektrode lar inngangen flyte fritt, slik at den effektive undertrykkingen kollapser og monitoren stryker på et kriterium den klarer med hel kabel."
    source: "IEC 60601-2-27:2011 §201.12.1.101 (EKG-ytelse — fellesmodusundertrykking)"
    source_type: standard
  - text: "Test alltid kabelkontinuitet MENS DU BØYER kabelen ved kjente stresspunkter. En statisk motstandsmåling kan vise normale verdier mens et intermitterende brudd bare viser seg under bevegelse."
    source_type: best-practice
  - text: "Ved feilsøking av EKG-støy forhindrer systematisk isolering (pasient → kabel → enhet → omgivelser) unødvendige enhetsbytter. De fleste EKG-støyklager skyldes kabel- eller elektrodeproblemer, ikke enhetsfeil."
    source_type: best-practice
